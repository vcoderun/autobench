# yaml-language-server: $schema=../../schemas/0.2.0/benchmark_schema.json
benchmark:
  minimal-text-transform:
    description: Transform text with two deterministic implementations.
    cases:
      - id: greeting
        input:
          text: hello autobench
        expected:
          text: HELLO AUTOBENCH
      - id: whitespace
        input:
          text: release ready
        expected:
          text: RELEASE READY
    run:
      python: minimal_benchmark:run
    variants:
      builtin_upper:
        label: Python upper
        factors:
          transform: upper
      title_then_upper:
        label: Composed transform
        factors:
          transform: title_upper
    score:
      exact_text:
        exact:
          actual: output.text
          expected: case.expected.text
        semantic: quality.correctness
        goal: maximize
        role: objective
    report:
      leaderboard:
        show:
          correctness:
            metric: quality.correctness
            aggregate: ratio_true
      matrix:
        metric: quality.correctness
      compare:
        builtin_upper -> title_then_upper:
          show:
            correctness:
              metric: quality.correctness
              aggregate: ratio_true
