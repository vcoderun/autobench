[project]
name = "autobench"
dynamic = ["version"]
description = "Autobench is a YAML-first benchmark and evidence framework."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = ["benchmarks", "evals", "agents", "experiments", "yaml"]
dependencies = [
    "click>=8.1.8",
    "matplotlib>=3.9",
    "pydantic>=2.7",
    "PyYAML>=6.0.2",
    "rich>=13.9.4",
]

[project.optional-dependencies]
dev = [
    "basedpyright",
    "mkdocs",
    "mkdocstrings[python]",
    "pre-commit",
    "pydantic>=2.7",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "ty",
]

[project.scripts]
autobench = "autobench.__main__:main"

[project.urls]
Repository = "https://github.com/vcoderun/autobench"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/autobench/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/autobench"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".venv",
    "references",
    "mocks",
    "ornek.py",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "W",      # pycodestyle warnings
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument
]

[tool.ty]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
exclude = [
    "references/**",
    "mocks/**",
    "ornek.py",
]

[tool.ty.rules]
unresolved-import = "ignore"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--color=yes",
]
markers = []

[tool.coverage.run]
branch = true
source = ["src/autobench"]
omit = [
    "src/autobench/_version.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
fail_under = 100
