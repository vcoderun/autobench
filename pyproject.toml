[project]
name = "autobench"
dynamic = ["version"]
description = "Define, run, record, compare, and replay benchmarks for Python applications."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = ["benchmarks", "evals", "agents", "experiments", "yaml"]
dependencies = [
    "click>=8.1.8",
    "filelock>=3.16",
    "packaging>=24",
    "pydantic>=2.7",
    "PyYAML>=6.0.2",
    "rich>=13.9.4",
]

[project.optional-dependencies]
dev = [
    "basedpyright",
    "httpx==0.28.1",
    "mkdocstrings-python",
    "openai==2.52.0",
    "openai-agents==0.19.2",
    "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
    "opentelemetry-sdk>=1.44,<2",
    "pre-commit",
    "pydantic>=2.7",
    "pydantic-gepa[integrations]>=0.1.0a0,<0.2; python_version < '3.14'",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "ty",
    "zensical",
]
httpx = [
    "httpx>=0.28,<0.29",
]
instrumentation = [
    "httpx>=0.28,<0.29",
    "openai>=2.52,<2.55",
    "openai-agents>=0.19.2,<0.20",
    "pydantic-ai-slim>=2.22,<2.24",
    "pydantic-gepa[integrations]>=0.1.0a0,<0.2; python_version < '3.14'",
]
openai = [
    "openai>=2.52,<2.55",
]
openai-agents = [
    "openai-agents>=0.19.2,<0.20",
]
pydantic-ai = [
    "pydantic-ai-slim>=2.22,<2.24",
]
pydantic-gepa = [
    "pydantic-gepa[integrations]>=0.1.0a0,<0.2; python_version < '3.14'",
]
otlp = [
    "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
    "opentelemetry-sdk>=1.44,<2",
]

[project.scripts]
autobench = "autobench.__main__:main"

[project.urls]
Documentation = "https://vcoderun.github.io/autobench/"
Repository = "https://github.com/vcoderun/autobench"
Changelog = "https://github.com/vcoderun/autobench/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/autobench/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/autobench"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.agents",
    "/.autobench",
    "/.cache",
    "/.codex",
    "/.env",
    "/.env.*",
    "/.pytest_cache",
    "/.ruff_cache",
    "/.venv",
    "/AGENTS.md",
    "/autobench-opus-export-final",
    "/COVERAGE",
    "/coverage.*",
    "/docs/*-plan.md",
    "/docs/_markdown",
    "/docs/plans",
    "/docs/plans.md",
    "/htmlcov",
    "/mocks",
    "/plans",
    "/references",
    "/runs",
    "/site",
    "/uv.lock",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".venv",
    "references",
    "mocks",
    "ornek.py",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "W",      # pycodestyle warnings
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument
]

[tool.ty]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
exclude = [
    "references/**",
    "mocks/**",
    "ornek.py",
]

[tool.ty.rules]
unresolved-import = "ignore"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--color=yes",
]
filterwarnings = ["error"]
markers = [
    "large_artifact: exercises full-size artifact persistence and is run outside the Python compatibility matrix",
]

[tool.coverage.run]
branch = true
source = ["src/autobench"]
omit = [
    "src/autobench/_version.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
fail_under = 100

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "openai==2.52.0",
    "openai-agents==0.19.2",
    "pydantic-ai-slim==2.23.0",
    "pydantic-gepa[integrations]>=0.1.0a0,<0.2; python_version < '3.14'",
]
matrix = [
    "httpx==0.28.1",
    "openai==2.52.0",
    "openai-agents==0.19.2",
    "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
    "opentelemetry-sdk>=1.44,<2",
    "pydantic-ai-slim==2.23.0",
    "pydantic-gepa[integrations]>=0.1.0a0,<0.2; python_version < '3.14'",
    "pytest",
    "pytest-asyncio",
]

[tool.uv.sources]
pydantic-gepa = { git = "https://github.com/vcoderun/pydantic-gepa.git", rev = "a39694b1debd1a33148bb4e1f036662a29ae3848" }
