case:
  id: parse_cron
  input:
    function_name: parse_cron
    description: 'Parse a five-field cron expression into sorted integer lists. Supports
      wildcards, ranges, steps, commas, and invalid-expression errors.

      '
    code: "def parse_cron(expression: str) -> dict:\n    fields = expression.strip().split()\n\
      \    if len(fields) != 5:\n        raise ValueError(f\"Expected 5 fields, got\
      \ {len(fields)}\")\n    names = [\"minute\", \"hour\", \"day_of_month\", \"\
      month\", \"day_of_week\"]\n    ranges = [(0, 59), (0, 23), (1, 31), (1, 12),\
      \ (0, 6)]\n    result = {}\n    for field, name, (lo, hi) in zip(fields, names,\
      \ ranges):\n        values = set()\n        for part in field.split(\",\"):\n\
      \            if part == \"*\":\n                values.update(range(lo, hi +\
      \ 1))\n            elif \"-\" in part:\n                start, end = map(int,\
      \ part.split(\"-\", 1))\n                if start < lo or end > hi or start\
      \ > end:\n                    raise ValueError(f\"{name}: invalid range\")\n\
      \                values.update(range(start, end + 1))\n            else:\n \
      \               val = int(part)\n                if val < lo or val > hi:\n\
      \                    raise ValueError(f\"{name}: out of range\")\n         \
      \       values.add(val)\n        result[name] = sorted(values)\n    return result\n"
  expected:
    min_coverage: 0.75
    all_passed: true
  metadata:
    difficulty: advanced
    complexity: 1.4
    expected_case_count: 8
    expected_raises_count: 2
  tags:
  - codemode
  - advanced
