case:
  id: eval_rpn
  input:
    function_name: eval_rpn
    description: 'Evaluate a Reverse Polish Notation expression. Supports +, -, *,
      and /. Division truncates toward zero and malformed expressions raise errors.

      '
    code: "def eval_rpn(tokens: list[str]) -> int:\n    if not tokens:\n        raise\
      \ ValueError(\"Empty expression\")\n    stack: list[int] = []\n    operators\
      \ = {\"+\", \"-\", \"*\", \"/\"}\n    for token in tokens:\n        if token\
      \ in operators:\n            if len(stack) < 2:\n                raise ValueError(f\"\
      Not enough operands for {token!r}\")\n            b, a = stack.pop(), stack.pop()\n\
      \            if token == \"+\":\n                stack.append(a + b)\n     \
      \       elif token == \"-\":\n                stack.append(a - b)\n        \
      \    elif token == \"*\":\n                stack.append(a * b)\n           \
      \ else:\n                if b == 0:\n                    raise ZeroDivisionError(\"\
      Division by zero\")\n                stack.append(int(a / b))\n        else:\n\
      \            stack.append(int(token))\n    if len(stack) != 1:\n        raise\
      \ ValueError(f\"Invalid expression: {len(stack)} values remaining\")\n    return\
      \ stack[0]\n"
  expected:
    all_passed: true
  metadata:
    difficulty: advanced
    complexity: 1.3
