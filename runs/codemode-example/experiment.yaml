spec_snapshot:
  benchmark:
    id: codemode-model-comparison
    description: 'Real CodeMode benchmark expressed on Autobench primitives. The task
      uses Vowel CodeModeGenerator and RunEvals, while recording, replay, reporting,
      comparison, and export remain generic Autobench behaviors.

      '
  dataset:
    id: null
    source: datasets/codemode_scenarios.yaml
    version: null
    metadata: {}
    cases:
    - id: group_by
      input:
        function_name: group_by
        description: 'Group a list of dictionaries by the value of a given key. Items
          missing the key are grouped under null.

          '
        code: "def group_by(items: list[dict], key: str) -> dict:\n    result: dict\
          \ = {}\n    for item in items:\n        group_key = item.get(key)\n    \
          \    if group_key not in result:\n            result[group_key] = []\n \
          \       result[group_key].append(item)\n    return result\n"
      expected:
        min_coverage: 0.82
        all_passed: true
      metadata:
        difficulty: intermediate
        complexity: 1.0
        expected_case_count: 5
        expected_raises_count: 1
      tags:
      - codemode
      - intermediate
      attachments: []
    - id: flatten
      input:
        function_name: flatten
        description: 'Recursively flatten an arbitrarily nested list. Non-list elements
          are preserved, and non-list inputs raise TypeError.

          '
        code: "def flatten(value: list) -> list:\n    if not isinstance(value, list):\n\
          \        raise TypeError(f\"Expected list, got {type(value).__name__}\"\
          )\n    result = []\n    for item in value:\n        if isinstance(item,\
          \ list):\n            result.extend(flatten(item))\n        else:\n    \
          \        result.append(item)\n    return result\n"
      expected:
        min_coverage: 0.82
        all_passed: true
      metadata:
        difficulty: intermediate
        complexity: 1.1
        expected_case_count: 6
        expected_raises_count: 1
      tags:
      - codemode
      - intermediate
      attachments: []
    - id: parse_cron
      input:
        function_name: parse_cron
        description: 'Parse a five-field cron expression into sorted integer lists.
          Supports wildcards, ranges, steps, commas, and invalid-expression errors.

          '
        code: "def parse_cron(expression: str) -> dict:\n    fields = expression.strip().split()\n\
          \    if len(fields) != 5:\n        raise ValueError(f\"Expected 5 fields,\
          \ got {len(fields)}\")\n    names = [\"minute\", \"hour\", \"day_of_month\"\
          , \"month\", \"day_of_week\"]\n    ranges = [(0, 59), (0, 23), (1, 31),\
          \ (1, 12), (0, 6)]\n    result = {}\n    for field, name, (lo, hi) in zip(fields,\
          \ names, ranges):\n        values = set()\n        for part in field.split(\"\
          ,\"):\n            if part == \"*\":\n                values.update(range(lo,\
          \ hi + 1))\n            elif \"-\" in part:\n                start, end\
          \ = map(int, part.split(\"-\", 1))\n                if start < lo or end\
          \ > hi or start > end:\n                    raise ValueError(f\"{name}:\
          \ invalid range\")\n                values.update(range(start, end + 1))\n\
          \            else:\n                val = int(part)\n                if\
          \ val < lo or val > hi:\n                    raise ValueError(f\"{name}:\
          \ out of range\")\n                values.add(val)\n        result[name]\
          \ = sorted(values)\n    return result\n"
      expected:
        min_coverage: 0.75
        all_passed: true
      metadata:
        difficulty: advanced
        complexity: 1.4
        expected_case_count: 8
        expected_raises_count: 2
      tags:
      - codemode
      - advanced
      attachments: []
    - id: eval_rpn
      input:
        function_name: eval_rpn
        description: 'Evaluate a Reverse Polish Notation expression. Supports +, -,
          *, and /. Division truncates toward zero and malformed expressions raise
          errors.

          '
        code: "def eval_rpn(tokens: list[str]) -> int:\n    if not tokens:\n     \
          \   raise ValueError(\"Empty expression\")\n    stack: list[int] = []\n\
          \    operators = {\"+\", \"-\", \"*\", \"/\"}\n    for token in tokens:\n\
          \        if token in operators:\n            if len(stack) < 2:\n      \
          \          raise ValueError(f\"Not enough operands for {token!r}\")\n  \
          \          b, a = stack.pop(), stack.pop()\n            if token == \"+\"\
          :\n                stack.append(a + b)\n            elif token == \"-\"\
          :\n                stack.append(a - b)\n            elif token == \"*\"\
          :\n                stack.append(a * b)\n            else:\n            \
          \    if b == 0:\n                    raise ZeroDivisionError(\"Division\
          \ by zero\")\n                stack.append(int(a / b))\n        else:\n\
          \            stack.append(int(token))\n    if len(stack) != 1:\n       \
          \ raise ValueError(f\"Invalid expression: {len(stack)} values remaining\"\
          )\n    return stack[0]\n"
      expected:
        all_passed: true
      metadata:
        difficulty: advanced
        complexity: 1.3
      tags:
      - codemode
      - advanced
      attachments: []
    - id: levenshtein
      input:
        function_name: levenshtein
        description: 'Compute the Levenshtein edit distance between two strings using
          dynamic programming, and reject non-string inputs.

          '
        code: "def levenshtein(s: str, t: str) -> int:\n    if not isinstance(s, str)\
          \ or not isinstance(t, str):\n        raise TypeError(\"Both arguments must\
          \ be strings\")\n    m, n = len(s), len(t)\n    dp = list(range(n + 1))\n\
          \    for i in range(1, m + 1):\n        prev = dp[0]\n        dp[0] = i\n\
          \        for j in range(1, n + 1):\n            temp = dp[j]\n         \
          \   if s[i - 1] == t[j - 1]:\n                dp[j] = prev\n           \
          \ else:\n                dp[j] = 1 + min(prev, dp[j], dp[j - 1])\n     \
          \       prev = temp\n    return dp[n]\n"
      expected:
        all_passed: true
      metadata:
        difficulty: advanced
        complexity: 1.35
      tags:
      - codemode
      - advanced
      attachments: []
    case_defaults:
      input: null
      expected: null
      metadata: {}
      tags: []
      attachments: []
