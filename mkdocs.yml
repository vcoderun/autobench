site_name: Autobench
site_url: https://vcoderun.github.io/autobench/
site_description: Replayable, semantic benchmark evidence for any system.
repo_url: https://github.com/vcoderun/autobench
repo_name: vcoderun/autobench
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Autobench contributors
theme:
  variant: modern
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: lucide/gauge
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      primary: teal
      accent: amber
      toggle:
        icon: lucide/sun-moon
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: lucide/sun
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: lucide/moon
        name: Switch to system preference
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.top
    - toc.follow
    - content.action.edit
    - content.action.view
    - content.code.copy
    - search.highlight
markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
plugins:
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
nav:
  - Home: index.md
  - Guide:
      - Getting Started: getting-started.md
      - Concepts: concepts.md
      - Examples: examples.md
      - Current Capabilities: current-capabilities-guide.md
  - Workflows:
      - Scoring And Derivation: scoring-and-derivation.md
      - Recording And Reporting: recording-and-reporting.md
      - CLI: cli.md
  - Reference:
      - YAML Spec: yaml-spec.md
      - Python API: python-api.md
      - API Reference: api-reference.md
  - Project:
      - Development: development.md
      - Release Notes:
          - 0.1.0: release-notes/0.1.0.md
