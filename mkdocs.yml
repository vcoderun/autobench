site_name: Autobench
site_url: https://vcoderun.github.io/autobench/
site_description: Replayable, semantic benchmark evidence for any system.
repo_url: https://github.com/vcoderun/autobench
repo_name: vcoderun/autobench
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Autobench contributors
theme:
  variant: modern
  custom_dir: overrides
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: lucide/gauge
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      primary: teal
      accent: amber
      toggle:
        icon: lucide/sun-moon
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: lucide/sun
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: lucide/moon
        name: Switch to system preference
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - toc.follow
    - content.action.edit
    - content.action.view
    - content.code.copy
    - search.highlight
markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
extra_css:
  - stylesheets/copy-markdown.css
extra_javascript:
  - javascripts/copy-markdown.js
plugins:
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
nav:
  - Home: index.md
  - Get Started:
      - Installation: installation.md
      - First Benchmark: getting-started.md
      - Use Cases: use-cases.md
      - Example Projects: examples.md
  - Foundations:
      - Architecture: architecture.md
      - Core Concepts: concepts.md
      - Datasets And Variants: datasets-and-variants.md
      - Tasks And Runtime: tasks-and-runtime.md
      - Observations And Semantics: observations-and-semantics.md
  - Evaluation:
      - Scoring And Derivation: scoring-and-derivation.md
      - Agentic Evaluation: agentic-evaluation.md
  - Evidence And Lineage:
      - Recording And Reporting: recording-and-reporting.md
      - Asset Tracking: asset-tracking.md
      - Automatic Asset Discovery: automatic-asset-discovery.md
  - Autobench Protocol (ABP):
      - Protocol And Traces: instrumentation-and-traces.md
      - Native Instrumentation: native-instrumentation.md
      - Compatibility Contract: abp-compatibility.md
  - Reference:
      - YAML Spec: yaml-spec.md
      - Python API: python-api.md
      - CLI: cli.md
      - Capability Map: capabilities.md
      - API Reference: api-reference.md
      - Troubleshooting: troubleshooting.md
  - Project:
      - Development: development.md
      - Release Notes:
          - 0.2.0: release-notes/0.2.0.md
          - 0.1.0: release-notes/0.1.0.md
